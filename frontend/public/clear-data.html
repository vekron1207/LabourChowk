<!DOCTYPE html>
<html>
<head>
    <title>Clear Labour Chowk Data</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #333; margin-bottom: 1rem; }
        button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            margin: 0.5rem;
        }
        button:hover { background: #dc2626; }
        .success { color: #10b981; font-weight: bold; margin-top: 1rem; }
        .info {
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
            font-size: 0.875rem;
        }
        .back-btn {
            background: #6366f1;
            margin-top: 1rem;
        }
        .back-btn:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ Clear Labour Chowk Data</h1>

        <div class="info">
            This will clear all local data including:
            <ul style="text-align: left; margin-top: 0.5rem;">
                <li>All jobs</li>
                <li>All labour profiles</li>
                <li>All users data</li>
                <li>Current session</li>
            </ul>
        </div>

        <button onclick="clearAllData()">Clear All Data</button>
        <button class="back-btn" onclick="goBack()">Back to App</button>

        <div id="message"></div>
    </div>

    <script>
        function clearAllData() {
            // Clear all Labour Chowk data
            localStorage.removeItem('labour_chowk_jobs');
            localStorage.removeItem('labour_chowk_labour_profiles');
            localStorage.removeItem('labour_chowk_users');
            localStorage.removeItem('user');
            localStorage.removeItem('selectedRole');
            localStorage.removeItem('language');

            document.getElementById('message').innerHTML =
                '<div class="success">✅ All data cleared successfully!</div>';

            setTimeout(() => {
                window.location.href = '/';
            }, 1500);
        }

        function goBack() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
